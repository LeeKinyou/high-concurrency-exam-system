{% extends "base.html" %}
{% block title %}考试二维码 - 在线考试系统{% endblock %}
{% block content %}
<style>
body {
    font-family: 'Noto Sans SC', sans-serif !important;
    background: #f8fafc !important;
    color: #1e293b !important;
    margin: 0 !important;
    padding: 0 !important;
    min-height: 100vh !important;
}
.container { max-width: none !important; margin: 0 !important; padding: 0 !important; }
.fade-in-up {
    animation: fadeInUp 0.5s ease-out both;
}
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}
.qr-card {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    overflow: hidden;
}
.qr-image {
    max-width: 280px;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 12px;
    background: white;
}
.link-box {
    background: linear-gradient(135deg, #f8fafc, #f1f5f9);
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 16px;
}
.btn-back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    background: white;
    color: #475569;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    transition: all 0.2s ease;
}
.btn-back:hover {
    background: #f8fafc;
    border-color: #cbd5e1;
}
.exam-code {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 16px;
    background: linear-gradient(135deg, #eff6ff, #dbeafe);
    border: 1px solid #bfdbfe;
    border-radius: 8px;
    font-family: 'SF Mono', monospace;
    font-size: 18px;
    font-weight: 700;
    color: #1e40af;
    letter-spacing: 2px;
}
</style>

<div class="min-h-screen bg-slate-50">
    <div class="max-w-lg mx-auto px-4 sm:px-6 py-6">
        <div class="flex items-center justify-between mb-8 fade-in-up">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold text-slate-800">考试二维码</h1>
                <p class="text-slate-500 mt-1 text-sm">分享二维码或考试码给学生</p>
            </div>
            <a href="/teacher/exams/{{ exam.id }}/edit/" class="btn-back">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                返回编辑
            </a>
        </div>

        <div class="qr-card p-6 sm:p-8 text-center fade-in-up" style="animation-delay: 0.1s">
            <h2 class="text-xl font-bold text-slate-800 mb-2">{{ exam.title }}</h2>
            <div class="flex justify-center mb-6">
                <div class="exam-code">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 20l4-16m2 16l4-16M6 9h14M4 15h14"></path></svg>
                    {{ exam.exam_code }}
                </div>
            </div>

            <div class="flex justify-center mb-6">
                {% load base64_filters %}
                <img src="data:image/png;base64,{{ qr_image|b64encode }}" alt="考试二维码" class="qr-image">
            </div>

            <p class="text-slate-500 text-sm mb-6">学生扫描二维码或输入考试码即可进入考试</p>

            <div class="link-box">
                <p class="text-xs text-slate-400 mb-2">考试入口链接</p>
                <p class="text-sm text-slate-600 font-mono break-all bg-white px-3 py-2 rounded-lg border border-slate-200">
                    /exams/{{ exam.id }}/enter/?code={{ exam.exam_code }}
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
