<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生成课堂二维码</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .qr-container {
            max-width: 500px;
            margin: 0 auto;
        }
        .qr-box {
            border: 2px solid #0d6efd;
            border-radius: 10px;
            padding: 30px;
            background-color: #f8f9fa;
            text-align: center;
        }
        #qrcode {
            margin: 20px auto;
            min-height: 256px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .timer-bar {
            height: 6px;
            background: linear-gradient(to right, #0d6efd, #0dcaf0);
            border-radius: 3px;
            margin: 20px 0;
            transition: width 0.1s linear;
        }
        .status-badge {
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 20px;
        }
        .status-valid {
            background-color: #d1e7dd;
            color: #0f5132;
        }
        .status-expired {
            background-color: #f8d7da;
            color: #842029;
        }
        .info-text {
            color: #6c757d;
            font-size: 14px;
        }
        .refresh-indicator {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #0d6efd;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="qr-container">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">📱 课堂二维码</h4>
                </div>
                <div class="card-body">
                    <div class="qr-box">
                        <div id="statusBadge" class="status-badge status-valid mb-3">
                            ✅ 二维码有效
                        </div>
                        
                        <div id="qrcode"></div>
                        
                        <div class="timer-bar" id="timerBar"></div>
                        
                        <div class="mb-3">
                            <span id="refreshIndicator" class="refresh-indicator" style="display: none;"></span>
                            <span id="timerText" class="info-text">下次刷新：<strong id="countdown">10</strong>秒</span>
                        </div>
                        
                        <p class="info-text mb-0">
                            📌 学生扫码后需输入学号和密码登录<br>
                            🔄 二维码每 10 秒自动刷新一次
                        </p>
                    </div>
                    
                    <div class="mt-4">
                        <div class="alert alert-info">
                            <strong>💡 使用提示：</strong>
                            <ul class="mb-0 mt-2">
                                <li>请让学生使用手机扫描二维码</li>
                                <li>二维码会自动刷新，无需手动操作</li>
                                <li>刷新频率：9.5 秒</li>
                            </ul>
                        </div>
                    </div>
                    
                    <div class="d-grid">
                        <a href="{% url 'admin:index' %}" class="btn btn-outline-secondary">
                            ← 返回后台管理
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let qrcode = null;
        let currentSessionId = null;
        let countdown = 10;
        const REFRESH_INTERVAL = 9.5;
        
        const statusBadge = document.getElementById('statusBadge');
        const timerBar = document.getElementById('timerBar');
        const countdownEl = document.getElementById('countdown');
        const refreshIndicator = document.getElementById('refreshIndicator');
        
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0;
                var v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }
        
        async function fetchSessionId() {
            try {
                refreshIndicator.style.display = 'inline-block';
                
                const response = await fetch('/accounts/api/session-id/', {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': getCookie('csrftoken')
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    currentSessionId = data.session_id;
                    const loginUrl = data.login_url;
                    
                    if (qrcode) {
                        document.getElementById('qrcode').innerHTML = '';
                    }
                    
                    qrcode = new QRCode(document.getElementById('qrcode'), {
                        text: loginUrl,
                        width: 256,
                        height: 256,
                        colorDark: '#000000',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.H
                    });
                    
                    setValidStatus();
                    resetTimer();
                } else {
                    console.error('获取 session_id 失败:', data.error);
                    setExpiredStatus();
                }
            } catch (error) {
                console.error('请求失败:', error);
                setExpiredStatus();
            } finally {
                refreshIndicator.style.display = 'none';
            }
        }
        
        function setValidStatus() {
            statusBadge.className = 'status-badge status-valid mb-3';
            statusBadge.innerHTML = '✅ 二维码有效';
        }
        
        function setExpiredStatus() {
            statusBadge.className = 'status-badge status-expired mb-3';
            statusBadge.innerHTML = '⚠️ 二维码生成失败，请刷新页面';
        }
        
        function resetTimer() {
            countdown = REFRESH_INTERVAL * 10;
            updateTimerDisplay();
        }
        
        function updateTimerDisplay() {
            const seconds = (countdown / 10).toFixed(1);
            countdownEl.textContent = seconds;
            
            const percentage = (countdown / (REFRESH_INTERVAL * 10)) * 100;
            timerBar.style.width = percentage + '%';
            
            if (countdown <= 0) {
                fetchSessionId();
            } else {
                countdown--;
                setTimeout(updateTimerDisplay, 100);
            }
        }
        
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            fetchSessionId();
            
            setInterval(function() {
                if (currentSessionId) {
                    fetch('/accounts/api/session-id/', {
                        method: 'POST',
                        headers: {
                            'X-CSRFToken': getCookie('csrftoken')
                        }
                    }).then(response => response.json())
                      .then(data => {
                          if (data.success) {
                              console.log('后台刷新 session_id 成功');
                          }
                      });
                }
            }, 5000);
        });
    </script>
</body>
</html>
