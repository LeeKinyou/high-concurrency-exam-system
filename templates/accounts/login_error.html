<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录错误</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .error-container {
            max-width: 500px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="error-container">
            <div class="card shadow">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">⚠️ 登录失败</h4>
                </div>
                <div class="card-body text-center py-5">
                    <div style="font-size: 72px; margin-bottom: 20px;">❌</div>
                    
                    {% if error_message %}
                    <h5 class="mb-3">{{ error_message }}</h5>
                    {% else %}
                    <h5 class="mb-3">二维码失效，请重新扫码</h5>
                    {% endif %}
                    
                    <p class="text-muted mb-4">
                        📱 学生专属通道<br>
                        ⏱️ 二维码有效期为 10 秒，过期后需要重新扫描
                    </p>
                    
                    <div class="d-grid gap-2">
                        <a href="javascript:history.back()" class="btn btn-primary">
                            🔄 返回重试
                        </a>
                        {% if user.is_authenticated and user.role == 'teacher' %}
                        <a href="{% url 'teacher:dashboard' %}" class="btn btn-outline-secondary">
                            👨‍🏫 前往教师端
                        </a>
                        {% else %}
                        <a href="{% url 'admin:index' %}" class="btn btn-outline-secondary">
                            联系老师
                        </a>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
