<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考试已提交</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-success text-white">
                        <h4 class="mb-0">✅ 考试已提交</h4>
                    </div>
                    <div class="card-body text-center py-5">
                        <div style="font-size: 72px; margin-bottom: 20px;">🎉</div>
                        <h5 class="mb-3">{{ exam.title }}</h5>
                        <p class="text-muted mb-4">
                            您的答案已成功提交<br>
                            提交时间：{{ record.submitted_at|date:"Y-m-d H:i:s" }}
                        </p>
                        {% if record.final_score > 0 %}
                        <div class="alert alert-success">
                            <strong>得分：{{ record.final_score }} / {{ exam.max_score }}分</strong>
                        </div>
                        {% endif %}
                        <div class="d-grid gap-2">
                            <a href="{% url 'exams:exam_list' %}" class="btn btn-primary">
                                ← 返回考试列表
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
