[project]
name = "dexam"
version = "0.1.0"
description = "Online Exam System - Django based education exam management platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0,<6.1",
    "openpyxl>=3.1",
    "qrcode>=8.0",
    "Pillow>=10.0",
    "redis>=5.0",
    "celery>=5.4",
    "django-storages[boto3]>=1.14",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "flake8>=7.0",
    "black>=24.0",
    "isort>=5.13",
]
mysql = [
    "mysqlclient>=2.2",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.testing"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120
